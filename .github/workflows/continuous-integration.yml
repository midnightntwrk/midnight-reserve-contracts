name: Continuous Integration

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  #v7.0.1
      - uses: aiken-lang/setup-aiken@1728a4be43be099752e22d8b841706caaa6fdd88  #v1.0.4
        with:
          version: v1.1.21
      - run: aiken fmt --check
      - run: aiken check
      - run: aiken build

      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76  # v1.22.0
        with:
          node-version-file: package.json
          cache: true
          run-install: "{ args: ['--frozen-lockfile'] }"
      - run: vp check
      - run: vp exec tsc --noEmit
      - run: vp test
